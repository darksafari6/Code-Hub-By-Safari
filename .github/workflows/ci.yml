name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Electron is only needed for desktop packaging, not for CI checks.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the server
        run: |
          npm start &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/files/tree
          if curl -fsS "http://127.0.0.1:3000/api/files/content?path=../package.json"; then
            echo "Path traversal was not blocked"; exit 1
          fi
